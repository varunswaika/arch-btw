source = colors.conf

# BACKGROUND
background {
    monitor =
    path = /home/varun/Desktop/Rice/rice-setup/stow-packages/wallpapers/1-background.png   # supports png, jpg, webp (no animations, though)
    blur_passes = 2
    contrast = 0.9
    brightness = 0.5
    vibrancy = 0.17
    vibrancy_darkness = 0
}

# GENERAL
general {
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 40
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $pine
    inner_color = $surface
    font_color = $text
    fade_on_empty = true
    placeholder_text = Enter password...
    hide_input = false
    position = 0, 150
    halign = center
    valign = bottom
    check_color = $iris
    fail_color = $love
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = $rose
    font_family = FiraCode Nerd Font Bold
    font_size = 180
    position = 0, 150
    halign = center
    valign = center
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = $text
    font_family = FiraCode Nerd Font Bold
    font_size = 180
    position = 0, -75
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%a, %b %d")"
    color = $text
    font_family = FiraCode Nerd Font
    position = 100, -100
    halign = left
    valign = top
}