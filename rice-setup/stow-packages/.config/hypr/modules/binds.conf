## Keybind configuration ##

$mainMod = Super # Sets "Windows" key as main modifier

# Terminal
bind = $mainMod, Return, exec, $terminal

# File manager
bind = $mainMod, F, exec, $fileManager

# Browser
bind = $mainMod, B, exec, $browser

# Screenshots
bind = $mainMod, F12, exec, ~/.config/hypr/scripts/screenshot full
bind = $mainMod, G, exec, ~/.config/hypr/scripts/screenshot region

# Rofi
bind = $mainMod, Space, exec, pkill rofi || rofi -show drun

# Waybar
bind = $mainMod, R, exec, ~/.config/waybar/scripts/launch.sh

# Action center
bind = $mainMod, A, exec, swaync-client -t

# Color picker
bind = $mainMod, H, exec, hyprpicker -a

# Custom
bind = $mainMod, Escape, exec, wlogout -C "$HOME/.config/wlogout/style.css" \
        -l "$HOME/.config/wlogout/layout" \
        --protocol layer-shell \
        -b 5 \
        -T 400 \
        -B 400
bind = $mainMod, Backspace, exec, poweroff

# Tools
bind = $mainMod, I, exec, $terminal -e ~/.config/hypr/scripts/pacman-install
bind = $mainMod, U, exec, $terminal -e ~/.config/hypr/scripts/aur-install
bind = $mainMod, S, exec, ~/.config/hypr/scripts/screenrecord
bind = $mainMod, K, exec, ~/.config/hypr/scripts/keybindings-menu
bind = , F1, exec, ~/.config/hypr/scripts/keybindings-menu


# System stuff
bind = $mainMod, L, exec, hyprlock
bind = CTRL ALT, DELETE, exec, wlogout -C "$HOME/.config/wlogout/style.css" \
        -l "$HOME/.config/wlogout/layout" \
        --protocol layer-shell \
        -b 5 \
        -T 400 \
        -B 400

# Hyprland stuff
bind = $mainMod, W, killactive
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, T, fullscreen

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with Alt + [0-9]
bind = Alt, 1, movetoworkspace, 1
bind = Alt, 2, movetoworkspace, 2
bind = Alt, 3, movetoworkspace, 3
bind = Alt, 4, movetoworkspace, 4
bind = Alt, 5, movetoworkspace, 5
bind = Alt, 6, movetoworkspace, 6
bind = Alt, 7, movetoworkspace, 7
bind = Alt, 8, movetoworkspace, 8
bind = Alt, 9, movetoworkspace, 9
bind = Alt, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, X, togglespecialworkspace, magic
bind = $mainMod, O, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume
bindel = ,F6, exec, ~/.config/hypr/scripts/volume.sh --toggle
bindel = ,F7, exec, ~/.config/hypr/scripts/volume.sh --dec
bindel = ,F8, exec, ~/.config/hypr/scripts/volume.sh --inc

# Brightness (using F2-F3)
bindel = ,F3, exec, ~/.config/hypr/scripts/brightness.sh --inc
bindel = ,F2, exec, ~/.config/hypr/scripts/brightness.sh --dec

# Music/media controls; requires playerctl
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

bind = ,F9, exec, playerctl previous
bind = ,F10, exec, playerctl play-pause
bind = ,F11, exec, playerctl next
