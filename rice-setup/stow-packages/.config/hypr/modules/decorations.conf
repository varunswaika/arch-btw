## Decoration configuration ##

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 3

    col.active_border = $rose
    col.inactive_border = $subtle

    # Resize by clicking and dragging on window borders
    resize_on_border = true

    # Directly disables VSync; monitor refresh rate is uncapped if true
    allow_tearing = false
}

decoration {
    rounding = 15
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 1
        passes = 2

        vibrancy = 0.1696
    }
}
