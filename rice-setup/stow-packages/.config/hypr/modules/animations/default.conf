animations {
    enabled = yes, please :)

    # Default set of bezier curves: they define how the animation is supposed to look
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = overshot,       0.34, 1.56, 0.64, 1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Actual animation configuration
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     3.5,   overshot, slide
    animation = windowsIn,     1,     3.5,   overshot, slide bottom
    animation = windowsOut,    1,     3.5,   overshot, slide bottom
    animation = fadeIn,        1,     3,     almostLinear
    animation = fadeOut,       1,     3,     almostLinear
    animation = fade,          1,     3,     quick
    animation = layers,        1,     3.5,   overshot, slide
    animation = layersIn,      1,     3.5,   overshot, slide left
    animation = layersOut,     1,     3.5,   overshot, slide right
    animation = fadeLayersIn,  1,     3,     almostLinear
    animation = fadeLayersOut, 1,     3,     almostLinear
    animation = workspaces,    1,     4.5,   overshot, slide
    animation = workspacesIn,  1,     4.5,   overshot, slide
    animation = workspacesOut, 1,     4.5,   overshot, slide
    animation = zoomFactor,    1,     7,     quick
}
