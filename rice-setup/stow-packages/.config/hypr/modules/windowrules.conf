## Windowrule configuration ##

# Syntax: windowrulev2 = <rule>, <criteria>

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Make only Nautilus have transparency
windowrulev2 = opacity 0.9 0.9, class:org.gnome.Nautilus

# Don’t let apps auto-fullscreen

windowrulev2 = suppressevent fullscreen, class:.*
