## Autostart configuration ##

# Syntax: exec-once = programName

exec-once = waybar
# Autostart configuration

# Setup XDG for screen sharing
exec-once = ~/.config/hypr/scripts/xdg-portal-hyprland

# Start Polkit
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Load Dunst Notification Manager
exec-once = swaync

# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Load Wallpaper
exec-once = swww-daemon --format xrgb
exec-once = ~/.config/hypr/scripts/wallpaper.sh

# Load Waybar
exec-once = ~/.config/waybar/scripts/launch.sh

# Load clipboard manager
exec-once = wl-paste --watch cliphist store


exec-once = swaync
exec-once = hypridle
exec-once = swayosd-libinput-backend

