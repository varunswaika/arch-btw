# Starship configuration to replicate zen-omp (Oh My Posh) style

# Define Catppuccin Mocha palette
[palettes.catppuccin_mocha]
blue = "#89b4fa"
grey = "#9399b2" # Overlay2
yellow = "#f9e2af"
magenta = "#cba6f7" # Mauve
red = "#f38ba8"
cyan = "#89dceb" # Sky
green = "#a6e3a1"

# Set the palette
palette = "catppuccin_mocha"

# Overall format
format = """
$directory\
$git_branch\
$git_status\
$line_break\
$character"""

# Right prompt format
right_format = """$cmd_duration"""

# Add a newline between prompts
add_newline = true

# Directory module
[directory]
style = "blue"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = ".../"

# Git Branch module
[git_branch]
style = "grey"
format = "[$symbol$branch]($style)"
symbol = ""  # No branch icon as per zen.toml

# Git Status module
[git_status]
style = "grey"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "[⇡](cyan)"
behind = "[⇣](cyan)"
diverged = "⇕"
untracked = "*"
stashed = "$"
modified = "*"
staged = "+"
renamed = "»"
deleted = "✘"

# Command Duration module
[cmd_duration]
min_time = 5000  # Show only if execution time > 5000ms
style = "yellow"
format = "[$duration]($style)"

# Character module (Prompt Symbol)
[character]
success_symbol = "[❯](magenta)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"
