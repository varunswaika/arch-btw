<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Default Sans-Serif Font -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Fira Sans</family>
      <family>OpenMoji</family>
    </prefer>
  </alias>

  <!-- Default Serif Font -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Fira Sans</family> <!-- Using Fira Sans as fallback since no specific Serif requested -->
      <family>OpenMoji</family>
    </prefer>
  </alias>

  <!-- Default Monospace Font -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>FiraCode Nerd Font</family>
      <family>OpenMoji</family>
    </prefer>
  </alias>
</fontconfig>